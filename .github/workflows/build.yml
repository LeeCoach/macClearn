name: Build and Package DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Release
        run: swift build -c release

      - name: Create App Bundle
        run: |
          APP_NAME="MacCleaner"
          APP_BUNDLE="dist/${APP_NAME}.app"

          mkdir -p "${APP_BUNDLE}/Contents/MacOS"
          mkdir -p "${APP_BUNDLE}/Contents/Resources"
          mkdir -p "${APP_BUNDLE}/Contents/_CodeSignature"

          cp ".build/release/${APP_NAME}" "${APP_BUNDLE}/Contents/MacOS/"
          cp "${APP_NAME}/Info.plist" "${APP_BUNDLE}/Contents/"
          cp "${APP_NAME}/Resources/MacCleanerIcon.icns" "${APP_BUNDLE}/Contents/Resources/"
          cp "${APP_NAME}/Resources/SidebarIcon.png" "${APP_BUNDLE}/Contents/Resources/"

          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable ${APP_NAME}" "${APP_BUNDLE}/Contents/Info.plist"

      - name: Extract Version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" MacCleaner/Info.plist)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          hdiutil create \
            -volname "MacCleaner" \
            -srcfolder "dist/MacCleaner.app" \
            -ov \
            -format UDZO \
            "dist/MacCleaner-${VERSION}.dmg"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacCleaner-${{ steps.version.outputs.version }}
          path: dist/MacCleaner-${{ steps.version.outputs.version }}.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MacCleaner-${{ steps.version.outputs.version }}.dmg
          generate_release_notes: true
