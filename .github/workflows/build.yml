name: Build and Package DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep 'static let marketing' MacCleaner/Version.swift | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Sync version into Info.plist
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" MacCleaner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION}" MacCleaner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" MacCleaner/Info.plist

      - name: Show Xcode toolchain
        run: xcodebuild -version && swift --version

      - name: Build Release
        run: swift build -c release

      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERTIFICATE_BASE64 != '' }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Create App Bundle
        run: |
          APP_NAME="MacCleaner"
          APP_BUNDLE="dist/${APP_NAME}.app"

          rm -rf "${APP_BUNDLE}"
          mkdir -p "${APP_BUNDLE}/Contents/MacOS"
          mkdir -p "${APP_BUNDLE}/Contents/Resources"

          cp ".build/release/${APP_NAME}" "${APP_BUNDLE}/Contents/MacOS/"
          cp "${APP_NAME}/Info.plist" "${APP_BUNDLE}/Contents/"
          cp "${APP_NAME}/Resources/MacCleanerIcon.icns" "${APP_BUNDLE}/Contents/Resources/"
          cp "${APP_NAME}/Resources/SidebarIcon.png" "${APP_BUNDLE}/Contents/Resources/"

          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable ${APP_NAME}" "${APP_BUNDLE}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.maccleaner.app" "${APP_BUNDLE}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName MacCleaner" "${APP_BUNDLE}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MacCleaner" "${APP_BUNDLE}/Contents/Info.plist"
          rm -rf "${APP_BUNDLE}/Contents/_CodeSignature"
          chmod +x "${APP_BUNDLE}/Contents/MacOS/${APP_NAME}"

      - name: Sign App Bundle
        run: |
          APP_BUNDLE="dist/MacCleaner.app"
          if [[ -n "${DEVELOPER_ID_APPLICATION}" ]]; then
            codesign --force --deep --options runtime --timestamp --sign "${DEVELOPER_ID_APPLICATION}" "${APP_BUNDLE}"
          else
            echo "::warning::Developer ID signing secrets are not configured. Using ad-hoc signing (same as local package-dmg.sh). Users may need: xattr -cr ~/Downloads/MacCleaner-*.dmg"
            codesign --force --deep --sign - "${APP_BUNDLE}"
          fi

          codesign --verify --deep --strict --verbose=2 "${APP_BUNDLE}"
          codesign -dv --verbose=4 "${APP_BUNDLE}"

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_PATH="dist/MacCleaner-${VERSION}.dmg"
          DMG_ROOT="dist/dmg-root"

          rm -f "${DMG_PATH}"
          rm -rf "${DMG_ROOT}"
          mkdir -p "${DMG_ROOT}"
          cp -R "dist/MacCleaner.app" "${DMG_ROOT}/"
          ln -s /Applications "${DMG_ROOT}/Applications"

          hdiutil create \
            -volname "MacCleaner" \
            -srcfolder "${DMG_ROOT}" \
            -ov \
            -format UDZO \
            "${DMG_PATH}"
          ls -lh "${DMG_PATH}"

      - name: Sign DMG
        if: ${{ env.DEVELOPER_ID_APPLICATION != '' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_PATH="dist/MacCleaner-${VERSION}.dmg"
          codesign --force --timestamp --sign "${DEVELOPER_ID_APPLICATION}" "${DMG_PATH}"
          codesign --verify --verbose=2 "${DMG_PATH}"

      - name: Notarize and staple DMG
        if: ${{ env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_PATH="dist/MacCleaner-${VERSION}.dmg"

          xcrun notarytool submit "${DMG_PATH}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple "${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacCleaner-${{ steps.version.outputs.version }}
          path: dist/MacCleaner-${{ steps.version.outputs.version }}.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MacCleaner ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: dist/MacCleaner-${{ steps.version.outputs.version }}.dmg
          generate_release_notes: true
          body: |
            ## MacCleaner ${{ steps.version.outputs.version }}

            ### Install / 安装

            1. Download **MacCleaner-${{ steps.version.outputs.version }}.dmg**
            2. Open the DMG and drag **MacCleaner** to **Applications**
            3. Grant **Full Disk Access** on first launch if you use disk cleanup

            **Requirements:** macOS 13 (Ventura) or later

            ---

            1. 下载 **MacCleaner-${{ steps.version.outputs.version }}.dmg**
            2. 打开镜像，将 **MacCleaner** 拖入 **应用程序**
            3. 使用磁盘清理前授予 **完全磁盘访问权限**

            **系统要求：** macOS 13（Ventura）及以上

            ### Gatekeeper / 下载后提示「已损坏」

            If the build was **ad-hoc signed** (no Apple notarization secrets in CI), run after download:

            ```bash
            xattr -cr ~/Downloads/MacCleaner-${{ steps.version.outputs.version }}.dmg
            ```

            若 CI 未配置公证（ad-hoc 签名），下载后可在终端执行上述命令。
